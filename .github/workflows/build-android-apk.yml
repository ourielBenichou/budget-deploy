name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android-apk.yml'
      - '!frontend/downloads/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare Capacitor Android project
        working-directory: frontend
        run: |
          npm run build:mobile
          npx cap add android
          npm run cap:assets || true
          npx cap sync android

      - name: Configure Android SDK path
        working-directory: frontend/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Build APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK for website download
        run: |
          mkdir -p frontend/downloads
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/downloads/budget-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-app-apk
          path: frontend/downloads/budget-app.apk
          retention-days: 30

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/downloads/budget-app.apk
          if git diff --staged --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Update Android APK download"
            git push
          fi
