<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2ec4b6">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/resources/icon.png">
    <title>ניהול משתמשים</title>
    <script>
        if (!localStorage.getItem('auth_token')) {
            window.location.replace('/login.html');
        }
    </script>
    <style>
        :root {
            --primary: #2ec4b6;
            --primary-dark: #24a195;
            --danger: #e71d36;
            --text-dark: #333333;
            --text-muted: #888888;
            --bg-main: #f4f6f9;
            --border-color: #e1e4e8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary {
            background: #f0f2f5;
            color: #4a5568;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            font-weight: bold;
        }

        .btn-primary:hover { background: var(--primary-dark); }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
        }

        .error-msg {
            display: none;
            background: #fde8ea;
            color: var(--danger);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .success-msg {
            display: none;
            background: #e2fbf5;
            color: #13786f;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid #f0f2f5;
            text-align: right;
            vertical-align: top;
        }

        th {
            color: var(--text-muted);
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .role-admin {
            background: #fff3cd;
            color: #856404;
        }

        .role-user {
            background: #e6f0fa;
            color: #2563a8;
        }

        .edit-form {
            display: grid;
            gap: 8px;
            min-width: 180px;
        }

        .edit-actions {
            display: flex;
            gap: 6px;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-danger {
            background: #fde8ea;
            color: var(--danger);
        }

        .row-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow: auto;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: #f8fafc;
            border-radius: 8px;
            padding: 14px;
        }

        .summary-card span {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .summary-card strong {
            font-size: 20px;
        }

        .budget-section h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .budget-section {
            margin-bottom: 18px;
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 14px;
        }

        .section-title {
            margin: 0 0 16px 0;
            font-size: 20px;
        }

        .requests-card {
            margin-bottom: 24px;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1>ניהול משתמשים</h1>
            <div class="actions">
                <a href="/app.html" class="btn btn-secondary">חזרה לאפליקציה</a>
                <button type="button" id="refresh-btn" class="btn btn-secondary">רענן</button>
            </div>
        </div>

        <div class="card requests-card">
            <h2 class="section-title">בקשות הרשמה ממתינות</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>שם</th>
                            <th>שם משתמש</th>
                            <th>אימייל</th>
                            <th>סוג</th>
                            <th>תאריך</th>
                            <th>פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="requests-list">
                        <tr><td colspan="6">טוען...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2 class="section-title">משתמשים פעילים</h2>
            <div id="error-msg" class="error-msg"></div>
            <div id="success-msg" class="success-msg"></div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>שם תצוגה</th>
                            <th>שם משתמש</th>
                            <th>אימייל</th>
                            <th>תפקיד</th>
                            <th>פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="users-list">
                        <tr><td colspan="5">טוען...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="budget-modal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2 id="budget-modal-title">תקציב משתמש</h2>
                <button type="button" id="close-budget-modal" class="btn btn-secondary">סגור</button>
            </div>

            <div class="form-group" style="max-width: 220px; margin-bottom: 16px;">
                <label for="budget-month-select">חודש</label>
                <input type="month" id="budget-month-select">
            </div>

            <div class="summary-grid">
                <div class="summary-card">
                    <span>יתרת פתיחה</span>
                    <strong id="budget-bank-balance">0 ₪</strong>
                </div>
                <div class="summary-card">
                    <span>סך הכנסות</span>
                    <strong id="budget-total-income">0 ₪</strong>
                </div>
                <div class="summary-card">
                    <span>סך הוצאות</span>
                    <strong id="budget-total-expenses">0 ₪</strong>
                </div>
                <div class="summary-card">
                    <span>מאזן נטו</span>
                    <strong id="budget-net-balance">0 ₪</strong>
                </div>
            </div>

            <div id="budget-content"></div>
        </div>
    </div>

    <script type="module" src="./src/mobile.js"></script>
    <script type="module" src="./src/admin.js?v=3"></script>
</body>
</html>
